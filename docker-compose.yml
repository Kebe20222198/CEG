# Ollama, serveur de modèles locaux, pour le fournisseur « ollama » de CEG.
#
#   docker compose up -d ollama
#   docker compose exec ollama ollama pull qwen2.5:3b
#   .venv/bin/ceg llm check
#
# Les modèles téléchargés sont conservés dans le volume « ollama ».
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  ollama:
